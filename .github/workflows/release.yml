name: Release

# Every job except `release` also runs on pull requests and on demand, so a
# change to this workflow is exercised end to end before a tag depends on it.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight rehearsal; a tag build always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
            use_zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_zigbuild: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version consistency
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          FILE_VERSION=$(cat VERSION)
          if [ "$CARGO_VERSION" != "$FILE_VERSION" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION VERSION=$FILE_VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$CARGO_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION tag=$GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl only)
        if: matrix.use_zigbuild
        run: sudo apt-get install -y musl-tools

      - name: Install cargo-zigbuild (Linux only)
        if: matrix.use_zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild --locked

      - name: Build binaries (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --locked --release --bin pgs-mcp --bin pgs --target ${{ matrix.target }}

      - name: Build binaries (native)
        if: "!matrix.use_zigbuild"
        run: cargo build --locked --release --bin pgs-mcp --bin pgs --target ${{ matrix.target }}

      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pgs-mcp pgs-mcp-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pgs pgs-${{ matrix.target }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/pgs-mcp.exe pgs-mcp-${{ matrix.target }}.exe
          cp target/${{ matrix.target }}/release/pgs.exe pgs-${{ matrix.target }}.exe

      - name: Smoke-test pgs-mcp (native targets)
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          BIN=./pgs-mcp-${{ matrix.target }}
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          RESPONSE=$(printf '%s\n' "$REQUEST" | "$BIN" 2>/dev/null | head -1)
          echo "$RESPONSE"
          case "$RESPONSE" in
            *'"supportedVersions"'*) ;;
            *) echo "pgs-mcp did not answer server/discover"; exit 1 ;;
          esac

      - name: Upload pgs-mcp artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-${{ matrix.target }}
          path: pgs-mcp-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload pgs artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-${{ matrix.target }}
          path: pgs-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload pgs-mcp artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-${{ matrix.target }}
          path: pgs-mcp-${{ matrix.target }}.exe
          if-no-files-found: error

      - name: Upload pgs artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-${{ matrix.target }}
          path: pgs-${{ matrix.target }}.exe
          if-no-files-found: error

  macos-universal:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Download x86_64 pgs-mcp artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-mcp-x86_64-apple-darwin

      - name: Download aarch64 pgs-mcp artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-mcp-aarch64-apple-darwin

      - name: Download x86_64 pgs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-x86_64-apple-darwin

      - name: Download aarch64 pgs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-aarch64-apple-darwin

      - name: Create universal pgs-mcp binary
        run: |
          lipo -create \
            -arch x86_64 pgs-mcp-x86_64-apple-darwin \
            -arch arm64 pgs-mcp-aarch64-apple-darwin \
            -output pgs-mcp-universal-apple-darwin
          chmod +x pgs-mcp-universal-apple-darwin

      - name: Create universal pgs binary
        run: |
          lipo -create \
            -arch x86_64 pgs-x86_64-apple-darwin \
            -arch arm64 pgs-aarch64-apple-darwin \
            -output pgs-universal-apple-darwin
          chmod +x pgs-universal-apple-darwin

      - name: Upload universal pgs-mcp artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-universal-apple-darwin
          path: pgs-mcp-universal-apple-darwin
          if-no-files-found: error

      - name: Upload universal pgs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-universal-apple-darwin
          path: pgs-universal-apple-darwin
          if-no-files-found: error

  checksums:
    name: Collect assets and checksums
    runs-on: ubuntu-latest
    needs: [build, macos-universal]
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the asset set and write SHA256SUMS
        working-directory: artifacts
        run: |
          EXPECTED=14
          COUNT=$(ls pgs* | wc -l)
          ls -l
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "expected $EXPECTED binaries, found $COUNT"
            exit 1
          fi
          sha256sum pgs* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/pgs*
            artifacts/SHA256SUMS
