name: Release

# Every job except `release` also runs on pull requests and on demand, so a
# change to this workflow is exercised end to end before a tag depends on it.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight rehearsal; a tag build always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
            use_zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_zigbuild: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_zigbuild: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version consistency
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          FILE_VERSION=$(cat VERSION)
          if [ "$CARGO_VERSION" != "$FILE_VERSION" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION VERSION=$FILE_VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$CARGO_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION tag=$GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl only)
        if: matrix.use_zigbuild
        run: sudo apt-get install -y musl-tools

      - name: Install cargo-zigbuild (Linux only)
        if: matrix.use_zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild --locked

      - name: Build binaries (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --locked --release --bin pgs-mcp --bin pgs --target ${{ matrix.target }}

      - name: Build binaries (native)
        if: "!matrix.use_zigbuild"
        run: cargo build --locked --release --bin pgs-mcp --bin pgs --target ${{ matrix.target }}

      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pgs-mcp pgs-mcp-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pgs pgs-${{ matrix.target }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/pgs-mcp.exe pgs-mcp-${{ matrix.target }}.exe
          cp target/${{ matrix.target }}/release/pgs.exe pgs-${{ matrix.target }}.exe

      - name: Smoke-test pgs-mcp (native targets)
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          BIN=./pgs-mcp-${{ matrix.target }}
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          RESPONSE=$(printf '%s\n' "$REQUEST" | "$BIN" 2>/dev/null | head -1)
          echo "$RESPONSE"
          case "$RESPONSE" in
            *'"supportedVersions"'*) ;;
            *) echo "pgs-mcp did not answer server/discover"; exit 1 ;;
          esac

      - name: Upload pgs-mcp artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-${{ matrix.target }}
          path: pgs-mcp-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload pgs artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-${{ matrix.target }}
          path: pgs-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload pgs-mcp artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-${{ matrix.target }}
          path: pgs-mcp-${{ matrix.target }}.exe
          if-no-files-found: error

      - name: Upload pgs artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-${{ matrix.target }}
          path: pgs-${{ matrix.target }}.exe
          if-no-files-found: error

  macos-universal:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Download x86_64 pgs-mcp artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-mcp-x86_64-apple-darwin

      - name: Download aarch64 pgs-mcp artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-mcp-aarch64-apple-darwin

      - name: Download x86_64 pgs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-x86_64-apple-darwin

      - name: Download aarch64 pgs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgs-aarch64-apple-darwin

      - name: Create universal pgs-mcp binary
        run: |
          lipo -create \
            -arch x86_64 pgs-mcp-x86_64-apple-darwin \
            -arch arm64 pgs-mcp-aarch64-apple-darwin \
            -output pgs-mcp-universal-apple-darwin
          chmod +x pgs-mcp-universal-apple-darwin

      - name: Create universal pgs binary
        run: |
          lipo -create \
            -arch x86_64 pgs-x86_64-apple-darwin \
            -arch arm64 pgs-aarch64-apple-darwin \
            -output pgs-universal-apple-darwin
          chmod +x pgs-universal-apple-darwin

      - name: Upload universal pgs-mcp artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-mcp-universal-apple-darwin
          path: pgs-mcp-universal-apple-darwin
          if-no-files-found: error

      - name: Upload universal pgs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgs-universal-apple-darwin
          path: pgs-universal-apple-darwin
          if-no-files-found: error

  checksums:
    name: Collect assets and checksums
    runs-on: ubuntu-latest
    needs: [build, macos-universal]
    timeout-minutes: 10

    steps:
      # The archives bundle LICENSE and README.md, and the MCP Bundle manifest
      # template lives under packaging/.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # The bare binaries stay exactly as built: the plugin launcher in
      # .mcp.json downloads pgs-mcp-<target> directly.
      - name: Build install archives and MCP Bundles
        run: packaging/package-assets.sh artifacts

      - name: Validate MCP Bundle manifests against the MCPB schema
        env:
          # Schema pinned to a modelcontextprotocol/mcpb commit; v0.3 is the
          # current manifest_version in that repository's MANIFEST.md.
          MCPB_SCHEMA_URL: https://raw.githubusercontent.com/modelcontextprotocol/mcpb/70fe3b34cd6dff1b3bba046638edc72a6467a4fb/schemas/mcpb-manifest-v0.3.schema.json
        run: |
          curl -fsSL "$MCPB_SCHEMA_URL" -o "$RUNNER_TEMP/mcpb.schema.json"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0
          "$RUNNER_TEMP/venv/bin/python" -I packaging/mcpb/validate.py \
            "$RUNNER_TEMP/mcpb.schema.json" artifacts/*.mcpb

      - name: Check the asset set and write SHA256SUMS
        working-directory: artifacts
        run: |
          EXPECTED_BINARIES=14
          EXPECTED_ARCHIVES=7
          EXPECTED_BUNDLES=7
          ls -l

          MISSING=0
          while read -r target; do
            EXT=
            ARCHIVE="pgs-$target.tar.gz"
            case "$target" in
              *windows*) EXT=.exe; ARCHIVE="pgs-$target.zip" ;;
            esac
            for asset in "pgs-$target$EXT" "pgs-mcp-$target$EXT" "$ARCHIVE" "pgs-mcp-$target.mcpb"; do
              if [ ! -f "$asset" ]; then
                echo "missing asset: $asset"
                MISSING=1
              fi
            done
          done < ../packaging/targets.txt
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          BINARIES=$(find . -maxdepth 1 -type f -name 'pgs-*' ! -name '*.tar.gz' ! -name '*.zip' ! -name '*.mcpb' | wc -l)
          ARCHIVES=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          BUNDLES=$(find . -maxdepth 1 -type f -name '*.mcpb' | wc -l)
          TOTAL=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$BINARIES" -ne "$EXPECTED_BINARIES" ]; then
            echo "expected $EXPECTED_BINARIES binaries, found $BINARIES"
            exit 1
          fi
          if [ "$ARCHIVES" -ne "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives, found $ARCHIVES"
            exit 1
          fi
          if [ "$BUNDLES" -ne "$EXPECTED_BUNDLES" ]; then
            echo "expected $EXPECTED_BUNDLES MCP Bundles, found $BUNDLES"
            exit 1
          fi
          if [ "$TOTAL" -ne $((EXPECTED_BINARIES + EXPECTED_ARCHIVES + EXPECTED_BUNDLES)) ]; then
            echo "unexpected files among the assets"
            exit 1
          fi
          sha256sum pgs-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/pgs*
            artifacts/SHA256SUMS
